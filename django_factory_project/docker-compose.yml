version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: factory_postgres
    restart: always
    environment:
      POSTGRES_DB: factory_pulse_db
      POSTGRES_USER: factory_user
      POSTGRES_PASSWORD: factory_secure_pwd_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory_user -d factory_pulse_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: factory_redis
    restart: always
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: factory_web
    restart: always
    command: gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SECRET_KEY=production-secret-key-replace
      - DEBUG=False
      - DB_NAME=factory_pulse_db
      - DB_USER=factory_user
      - DB_PASSWORD=factory_secure_pwd_2026
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=*
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery_worker:
    build: .
    container_name: factory_celery_worker
    restart: always
    command: celery -A core worker -l info
    volumes:
      - .:/app
    environment:
      - DB_HOST=db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  celery_beat:
    build: .
    container_name: factory_celery_beat
    restart: always
    command: celery -A core beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    environment:
      - DB_HOST=db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
